<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About</title>
    <link rel="stylesheet" href="about.css">
  </head>
  <body>
    <!-- ==================================
                      PAGE 1
        ================================== -->

    <div class="first-page">
      <header>
        <div class="logo">
          <img src="about-imgs/boldo-logo2.svg" alt="logo">
        </div>
        <nav>
          <ul>
            <li>Product</li>
            <li>Services</li>
            <li>About</li>
            <li class="button-log-in">Log in</li>
          </ul>
        </nav>
      </header>

      <section class="hero-section">
        <div class="about">
          About
        </div>
        <div class="title">
          <p>We love to make great things, things that matter.</p>
        </div>
        <div class="subtitle">
          <p>Funding handshake buyer business-to-business metrics iPad
            partnership. First mover advantage innovator success deployment
            non-disclosure.</p>
        </div>
      </section>
    </div>

    <!-- ==================================
                      PAGE 2
        ================================== -->

    <section>
      <div class="image-container">
        <div>
          <img src="about-imgs/img-top-left.svg" alt="img-top-left">
          <img src="about-imgs/img-bottom-left.svg" alt="img-top-right">
        </div>
        <div>
          <img src="about-imgs/img-middle.svg" alt="img-middle">
        </div>
        <div>
          <img src="about-imgs/img-top-right.svg" alt="img-bottom-left">
          <img src="about-imgs/img-bottom-right.svg" alt="img-bottom-right">
        </div>
      </div>
    </section>
  </body>
</html>
