<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <link rel="stylesheet" href="blog.css">
  </head>
  <body>
    <!-- ==================================
                    PAGE 1
        ================================== -->

    <header>
      <div class="logo">
        <img src="pics/boldo-logo.svg" alt="logo">
      </div>
      <nav>
        <ul>
          <li>Product</li>
          <li>Services</li>
          <li>About</li>
          <li class="button-log-in">Log in</li>
        </ul>
      </nav>
    </header>

    <div class="blog-container">
      <div class="blog">
        Blog
      </div>
      <div class="para">
        <p>Thoughts and words</p>
      </div>
    </div>

    <section>
      <img src="blog-images/first-image.svg" class="first-image"
        alt="first image">
      <div class="about-container">
        <div class="date">
          <p><span>Category</span> November 22, 2021</p>
        </div>
        <div class="title">
          <p>Pitch termsheet backing validation focus release.</p>
        </div>
        <div class="profile">
          <img src="blog-images/profile-left.svg" alt="left profile">
          <p>Chandler Bing</p>
        </div>
      </div>
    </section>
    <hr>

    <p>Latest news</p>

    <div>
      <div>
        <img src="blog-images/image-1.svg" alt="">
        <div class="profile-container">
          <div class="date">
            <p><span>Category</span> November 22, 2021</p>
          </div>
          <div class="subtitle">
            <p>Pitch termsheet backing validation focus release.</p>
          </div>
          <div class="profile">
            <img src="blog-images/profile-left.svg" alt="left profile">
            <p>Chandler Bing</p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
